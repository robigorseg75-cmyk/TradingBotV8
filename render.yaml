
services:
  - type: web
    name: coinsentra-trading-brain
    runtime: python
    plan: starter

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app

    healthCheckPath: /health

    disk:
      name: coinsentra-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11

      - key: DATA_DIR
        value: /var/data

      - key: DASHBOARD_PASSWORD
        generateValue: true

      - key: SECRET_KEY
        generateValue: true
